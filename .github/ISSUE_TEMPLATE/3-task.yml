name: Task
description: One PR-sized unit of work inside a story. Run it with /task #<number>.
labels: ["type:task"]
body:
  - type: textarea
    id: what
    attributes:
      label: What to build
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - …
    validations:
      required: true
  - type: textarea
    id: skills
    attributes:
      label: Skills in scope
      description: Project skills whose rules bind this task.
      placeholder: supabase-db, testing
  - type: dropdown
    id: executor
    attributes:
      label: Executor hint
      options:
        - grok (code via cursor-agent)
        - claude (pen.dev design / judgment-heavy)
    validations:
      required: true
  - type: checkboxes
    id: flags
    attributes:
      label: Flags
      options:
        - label: Test-first (logic)
        - label: Implements a PRD item that is still *proposed*
        - label: Depends on a PRD *open* question
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      placeholder: "#…"
