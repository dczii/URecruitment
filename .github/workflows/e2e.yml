# Playwright against the Vercel preview URL, desktop + phone.
# Preview protection is on, so this job needs VERCEL_AUTOMATION_BYPASS_SECRET.
# When the secret is missing (forks, first setup), skip with a notice and exit 0.
# Production deployments are out of scope (#90) and never trigger the job.
# The workflow file is read from the deployed commit, so a PR's own preview
# runs the PR's version of this file.
name: e2e

on:
  deployment_status:

permissions:
  contents: read

# Vercel sets the deployment ref to a commit SHA, so `github.ref` is empty here
# and would put every run in one group. Key on the deployed commit instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check bypass secret
        id: gate
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "::notice::e2e skipped: deployment_status.target_url is empty, so there is no preview to test."
            {
              echo "## e2e skipped"
              echo
              echo "No preview URL on this deployment status event."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BYPASS" ]; then
            echo "::notice::e2e skipped: VERCEL_AUTOMATION_BYPASS_SECRET is not set. Preview protection is on, so Playwright would hit the Vercel SSO page instead of the app. Add that repository secret to enable this job."
            {
              echo "## e2e skipped"
              echo
              echo "Preview protection is on. Add the repository secret \`VERCEL_AUTOMATION_BYPASS_SECRET\` so Playwright can reach the preview."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.gate.outputs.ready == 'true' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        if: ${{ steps.gate.outputs.ready == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        if: ${{ steps.gate.outputs.ready == 'true' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
          PLAYWRIGHT_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Job summary
        if: ${{ always() && steps.gate.outputs.ready == 'true' }}
        run: |
          {
            echo "## e2e"
            echo
            echo "- Playwright projects: \`desktop\` and \`phone\`"
            echo "- Base URL taken from \`deployment_status.target_url\`"
          } >> "$GITHUB_STEP_SUMMARY"
